    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>crazy random design</title>
    <meta name="description" content="A selection of design work by Tatiana Egoshina.">
    <link rel="icon" href="data:,">
    <style>
      :root {
        --label-height: 3.5rem;
        --gallery-gutter: clamp(1rem, 5vw, 5rem);
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-inline: max(env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px));
        color: #707070;
        background: #fff;
        font: 100%/1.25 Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      .fixed-label {
        position: fixed;
        z-index: 1;
        inset-inline: 0;
        display: grid;
        place-items: center;
        min-block-size: var(--label-height);
        padding-inline: max(1rem, var(--safe-inline));
        pointer-events: none;
        text-align: center;
      }

      .page-header {
        inset-block-start: 0;
        min-block-size: calc(var(--label-height) + var(--safe-top));
        padding-block-start: var(--safe-top);
      }

      .page-header h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 400;
      }

      .page-footer {
        inset-block-end: 0;
        min-block-size: calc(var(--label-height) + var(--safe-bottom));
        padding-block-end: var(--safe-bottom);
      }

      .page-footer a {
        display: inline-grid;
        place-items: center;
        min-block-size: 2.75rem;
        color: inherit;
        text-decoration: none;
        text-underline-offset: 0.2em;
        pointer-events: auto;
      }

      .page-footer a:hover,
      .page-footer a:focus-visible {
        text-decoration: underline;
      }

      .gallery {
        display: grid;
        gap: clamp(3rem, 9vw, 8rem);
        max-inline-size: 90rem;
        margin-inline: auto;
        padding-inline: max(var(--gallery-gutter), var(--safe-inline));
        padding-block-start: calc(var(--label-height) + var(--safe-top) + var(--gallery-gutter));
        padding-block-end: calc(var(--label-height) + var(--safe-bottom) + var(--gallery-gutter));
      }

      .gallery figure {
        margin: 0;
      }

      .work {
        --work-width: 42rem;
      }

      .work--wide {
        --work-width: 63rem;
      }

      .work--portrait {
        --work-width: 34rem;
      }

      .work--small {
        --work-width: 28rem;
      }

      .gallery > :first-child {
        --work-width: min(63rem, max(28rem, calc((100svh - 12rem) * 1.52)));
      }

      .gallery img,
      .gallery video {
        display: block;
        inline-size: min(100%, var(--work-width));
        block-size: auto;
        margin-inline: auto;
      }
    </style>
  </head>

    <script>
      const videoObserver = new IntersectionObserver((entries) => {
        for (const { target: video, isIntersecting } of entries) {
          if (isIntersecting) {
            video.play().catch(() => {});
          } else {
            video.pause();
          }
        }
      });

      document.querySelectorAll('.gallery video').forEach((video) => {
        videoObserver.observe(video);
      });
    </script>
